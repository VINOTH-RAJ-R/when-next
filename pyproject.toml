[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "when-next"
version = "0.1.0.dev0"
description = "Given a timestamp and a scheduling policy, return the next valid execution time and a plain-language reason for it."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Vinoth Raj R" }]
keywords = ["scheduling", "business-hours", "timezone", "holidays", "retry", "policy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dependencies = ["tzdata; platform_system == 'Windows'"]

[project.urls]
Homepage = "https://github.com/VINOTH-RAJ-R/when-next"
Issues = "https://github.com/VINOTH-RAJ-R/when-next/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/when_next"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
